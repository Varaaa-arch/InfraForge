name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs: 
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: infraforge
                    POSTGRES_PASSWORD: infraforge
                    POSTGRES_DB: infraforge
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            
            redis:
                image: redis:7-alpine
                ports: 
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        defaults:
            run:
                working-directory: backend
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                activate-environment: true
                enable-cache: true

            - name: Install Dependencies
              run: uv sync
            
            - name: Lint (Ruff)
              run: uv run ruff check .

            - name: Type check (mypy)
              run: uv run mypy app --ignore-missing-imports

            - name: Create .env for CI
              run: |
                cat > .env << 'ENVEOF'
                APP_NAME=InfraForge
                APP_VERSION=0.1.0
                DEBUG=true
                SECRET_KEY=ci-test-secret-key
                POSTGRES_HOST=postgres
                POSTGRES_PORT=5432
                POSTGRES_DB=infraforge
                POSTGRES_USER=infraforge
                POSTGRES_PASSWORD=infraforge
                REDIS_HOST=redis
                REDIS_PORT=6379
                ENVEOF

            - name: Wait for Postgres
              run: |
                for i in $(seq 1 30); do
                  if pg_isready -h postgres -p 5432 -U infraforge; then
                    echo "Postgres is ready"
                    break
                  fi
                  echo "Waiting for Postgres... ($i/30)"
                  sleep 1
                done

            - name: Run database migrations
              env:
                DATABASE_URL: postgresql+psycopg://infraforge:infraforge@postgres:5432/infraforge
              run: uv run alembic upgrade head

            - name: Test (Pytest)
              env:
                DATABASE_URL: postgresql+psycopg://infraforge:infraforge@postgres:5432/infraforge
              run: uv run pytest -v